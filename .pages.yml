# Pages CMS configuration (pagescms.org)
# Gives a form-based admin UI for the Course Materials page, so slides can be
# added by filling a form + dragging in the file — no editing courses.json by hand.
#
# KNOWN LIMIT: the CMS's upload form runs through a Vercel-hosted backend, which
# hard-caps request bodies at ~4.5MB. Slide decks (esp. .pptx) often exceed that —
# for anything bigger, upload directly via the GitHub web UI instead (no size limit),
# then hand-edit courses.json. See teaching/HOW-TO-ADD-MATERIALS.md (manual, any size)
# vs teaching/ADMIN-SETUP.md (this CMS, small files only).
#
# To use: deploy the site, push this repo to GitHub, then sign in at
# app.pagescms.org with GitHub and open this repo. See teaching/ADMIN-SETUP.md.

# Where uploaded PDFs are stored, and the public path written into the data.
media:
  input: teaching/files          # files are committed here in the repo
  output: /teaching/files        # ...and referenced by this URL path on the site
  extensions: [pdf, pptx, ppt, docx, png, jpg, jpeg]

content:
  - name: courses
    label: Courses & Materials
    path: teaching/courses.json
    type: file
    fields:
      - name: updated
        label: Fallback date (leave as-is; the page auto-dates itself)
        type: date
      - name: note
        label: Internal note
        type: string
      - name: courses
        label: Courses
        type: object
        list: true
        fields:
          - name: code
            label: Course code (e.g. IPE 331)
            type: string
          - name: title
            label: Course title
            type: string
          - name: term
            label: Term
            type: string
          - name: description
            label: One-line description
            type: text
          - name: materials
            label: Materials (slides, handouts)
            type: object
            list: true
            fields:
              - name: title
                label: Title (what students see)
                type: string
              - name: file
                label: File (PDF, PPTX, etc. — under ~4MB, see note above)
                type: file
              - name: type
                label: Type
                type: select
                options:
                  values: [Slides, Handout, Notes, Assignment, Reading]
              - name: date
                label: Date posted
                type: date
